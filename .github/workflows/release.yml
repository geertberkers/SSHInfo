name: Build and release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Release is only created if the tests pass (build runs them).
      - name: Build and test
        run: ./gradlew build --console=plain

      - name: Package Windows app
        run: ./gradlew createDistributable --console=plain

      - name: Zip app
        shell: pwsh
        run: Compress-Archive -Path build/compose/binaries/main/app/ssh-key-checker -DestinationPath ssh-key-checker-windows.zip

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          gh release create "$tag" ssh-key-checker-windows.zip \
            --title "Build ${{ github.run_number }}" \
            --notes "Automated build of ${GITHUB_SHA::7}. Unzip and run ssh-key-checker/ssh-key-checker.exe." \
            --target "$GITHUB_SHA"
